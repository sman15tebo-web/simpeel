<div aria-hidden="true" class="modal fade" id="modalTambahAkun" tabindex="-1">
<div class="modal-dialog modal-lg">
<div class="modal-content">
<div class="modal-header bg-primary text-white">
<h5 class="modal-title"><i class="fas fa-user-plus"></i> Tambah Akun Pegawai</h5>
<button class="btn-close btn-close-white" data-bs-dismiss="modal" type="button"></button>
</div>
<div class="modal-body">
<div class="alert alert-info py-2 mb-3 small"><i class="fas fa-info-circle me-1"></i>
                        Untuk Honorer, NIP/Username diisi dengan <strong>NIK + "00"</strong> (18 digit total).
                    </div>
<form id="formTambahAkun">
<!-- Baris 1: NIP | Password -->
<div class="row g-3 mb-3">
<div class="col-md-6">
<label class="form-label fw-semibold">NIP / Username <span class="text-danger">*</span></label>
<input class="form-control" id="akun_nip" maxlength="18" onblur="validasiNipAkun(this.value, this)" placeholder="18 digit NIP" required="" type="text"/>
<div class="invalid-feedback" id="akun_nip_feedback"></div>
<div class="form-text text-muted">Wajib 18 digit.</div>
</div>
<div class="col-md-6">
<label class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
<div class="input-group">
<input class="form-control" id="akun_password" placeholder="Masukkan password" required="" type="password"/>
<button class="btn btn-outline-secondary" onclick="
                                        const i=document.getElementById('akun_password');
                                        i.type = i.type==='password'?'text':'password';
                                    " type="button"><i class="fas fa-eye"></i></button>
</div>
</div>
</div>
<!-- Baris 2: Status Pegawai | Nama -->
<div class="row g-3 mb-3">
<div class="col-md-6">
<label class="form-label fw-semibold">Status Pegawai <span class="text-danger">*</span></label>
<select class="form-select" id="akun_statusPegawai" required="">
<option value="">-- Pilih Status --</option>
<option value="PNS">PNS</option>
<option value="PPPK">PPPK</option>
<option value="PPPK Paruh Waktu">PPPK Paruh Waktu</option>
<option value="Honorer">Honorer</option>
</select>
</div>
<div class="col-md-6">
<label class="form-label fw-semibold">Nama Lengkap <span class="text-danger">*</span></label>
<input class="form-control text-uppercase" id="akun_nama" oninput="this.value=this.value.toUpperCase()" placeholder="Nama sesuai identitas" required="" type="text"/>
</div>
</div>
<!-- Baris 3: NIK | Tanggal Lahir -->
<div class="row g-3 mb-2">
<div class="col-md-6">
<label class="form-label fw-semibold">NIK KTP <span class="text-danger">*</span></label>
<input class="form-control" id="akun_nik" maxlength="16" onblur="validasiNikAkun(this.value, this)" placeholder="16 digit NIK KTP" required="" type="text"/>
<div class="invalid-feedback" id="akun_nik_feedback"></div>
<div class="form-text text-muted">Wajib 16 digit.</div>
</div>
<div class="col-md-6">
<label class="form-label fw-semibold">Tanggal Lahir <span class="text-danger">*</span></label>
<input class="form-control" id="akun_tglLahir" max="9999-12-31" required="" type="date"/>
</div>
</div>
</form>
</div>
<div class="modal-footer">
<button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Batal</button>
<button class="btn btn-primary" onclick="simpanAkunPegawai()" type="button"><i class="fas fa-save"></i> Simpan Akun</button>
</div>
</div>
</div>
</div>
