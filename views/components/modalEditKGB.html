<div aria-hidden="true" class="modal fade" data-bs-backdrop="static" id="modalEditKGB" tabindex="-1">
<div class="modal-dialog">
<div class="modal-content">
<div class="modal-header text-white" style="background: linear-gradient(135deg, #4e73df, #224abe); border-bottom: 0;">
<h5 class="modal-title"><i class="fas fa-edit"></i> Update Data KGB</h5>
<button aria-label="Close" class="btn-close btn-close-white" data-bs-dismiss="modal" type="button"></button>
</div>
<div class="modal-body">
<div class="mb-3">
<label class="form-label">Nama Pegawai</label>
<input class="form-control" id="kgbNama" readonly="" type="text"/>
</div>
<div class="row mb-3">
<div class="col-6">
<label class="form-label">TMT Berkala Terakhir</label>
<input class="form-control" id="kgbTmtTerakhir" onchange="hitungKGBBerikutnya()" type="date"/>
</div>
<div class="col-6">
<label class="form-label text-primary fw-bold">Estimasi TMT Berikutnya</label>
<input class="form-control bg-light text-primary" id="kgbTmtBerikutnya" readonly="" type="date"/>
</div>
</div>
<div class="mb-3">
<label class="form-label">Gaji Pokok Terakhir</label>
<input class="form-control format-rupiah" id="kgb_gajiPokok" placeholder="Contoh: Rp 3.500.000" type="text"/>
</div>
<div class="alert alert-info small p-2 mb-0">
<i class="fas fa-info-circle"></i> Sistem akan otomatis menampilkan notifikasi jika tanggal
                        estimasi kurang dari 3 bulan dari sekarang.
                    </div>
</div>
<div class="modal-footer">
<button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Tutup</button>
<button class="btn btn-primary" onclick="simpanKGB()" type="button"><i class="fas fa-save"></i>
                        Simpan Data</button>
</div>
</div>
</div>
</div>
