<div aria-hidden="true" class="modal fade" id="modalSync" tabindex="-1">

<h5 class="modal-title"><i class="fas fa-sync-alt"></i> Sinkronisasi Data</h5>
<button aria-label="Close" class="btn-close btn-close-white" data-bs-dismiss="modal" type="button"></button>
</div>
<div class="modal-body">
<p class="small text-muted mb-3">Masukkan Link Exec Google Apps Script (API) versi Online untuk

<input class="form-control" id="syncExecUrl" placeholder="https://script.google.com/macros/s/.../exec" type="text"/>
</div>
</div>
<div class="modal-footer bg-light">
<button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Tutup</button>

</div>
</div>
