<div class="modal fade" id="simpeelLawModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <form onsubmit="saveSimpeelLaw(event)">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="simpeelLawModalTitle">Tambah Dasar Hukum</h5>
                    <button class="btn-close btn-close-white" type="button" data-bs-dismiss="modal" aria-label="Tutup"></button>
                </div>
                <div class="modal-body">
                    <input id="simpeelLawEditIndex" type="hidden" value="-1">
                    <div class="row g-3">
                        <div class="col-md-5">
                            <label class="form-label fw-bold" for="simpeelLawType">Jenis regulasi</label>
                            <input class="form-control" id="simpeelLawType" required maxlength="100">
                        </div>
                        <div class="col-md-7">
                            <label class="form-label fw-bold" for="simpeelLawNumber">Nomor &amp; tahun</label>
                            <input class="form-control" id="simpeelLawNumber" required maxlength="200">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold" for="simpeelLawTitle">Tentang / judul regulasi</label>
                            <input class="form-control" id="simpeelLawTitle" required maxlength="300">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold" for="simpeelLawRelation">Keterkaitan dengan SiMPEEL</label>
                            <textarea class="form-control" id="simpeelLawRelation" rows="3" required maxlength="2000"></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold" for="simpeelLawUrl">Tautan referensi resmi (opsional)</label>
                            <input class="form-control" id="simpeelLawUrl" type="url" maxlength="500" placeholder="https://...">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Batal</button>
                    <button class="btn btn-primary" type="submit"><i class="fas fa-save me-1"></i>Simpan Regulasi</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="simpeelSopPreviewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Pratinjau SOP Kepegawaian</h5>
                <a class="btn btn-sm btn-outline-primary ms-auto me-3" id="simpeelSopDownload" download="SOP_Kepegawaian.pdf">
                    <i class="fas fa-download me-1"></i>Unduh
                </a>
                <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Tutup"></button>
            </div>
            <div class="modal-body p-0">
                <iframe id="simpeelSopFrame" title="Pratinjau SOP Kepegawaian" style="width:100%;height:75vh;border:0"></iframe>
            </div>
        </div>
    </div>
</div>
